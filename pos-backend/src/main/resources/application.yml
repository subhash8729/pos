spring:
  application:
    name: pos-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:pos-temp}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  devtools:
    livereload:
      enabled: false

server:
  port: ${PORT:5000}

razorpay:
  api:
    key: ${RAZORPAY_KEY:}
    secret: ${RAZORPAY_SECRET:}

stripe:
  api:
    key: ${STRIPE_KEY:}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
    reset-url: ${FRONTEND_RESET_URL:${FRONTEND_URL:http://localhost:5173}/auth/reset-password?token=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://zosh-pos.vercel.app,https://pos-sytem-bcs6.vercel.app}

logging:
  level:
    org:
      hibernate:
        SQL: ${HIBERNATE_LOG_LEVEL:WARN}
        type:
          descriptor:
            sql: ${HIBERNATE_LOG_LEVEL:WARN}
